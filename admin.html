<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendrix Admin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:#f7f4f0; color:#2e2e2e; min-height:100vh; }
    .hidden { display:none !important; }
    #loginScreen, #dashboard { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
    .card { background:#fff; border-radius:20px; padding:1.5rem; box-shadow:0 6px 20px rgba(0,0,0,0.08); width:100%; max-width:500px; }
    .wide-card { max-width:1050px; }
    h1 { color:#5b7a8c; text-align:center; margin-bottom:1rem; }
    h2 { margin-bottom:0.5rem; }
    input, button, select, textarea { font-family:inherit; }
    input[type="email"], input[type="password"] { width:100%; padding:0.8rem; border:1px solid #ddd; border-radius:12px; margin-bottom:0.8rem; }
    .btn { display:inline-block; padding:0.7rem 1.4rem; background:#5b7a8c; color:#fff; border:none; border-radius:10px; font-weight:600; cursor:pointer; text-decoration:none; text-align:center; }
    .btn:hover { background:#3d5660; }
    .btn.small { padding:0.4rem 0.9rem; font-size:0.85rem; }
    .btn.danger { background:#b23b3b; }
    .btn.danger:hover { background:#8f2e2e; }
    .btn.secondary { background:#6e6e6e; }
    .btn.secondary:hover { background:#555; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1.5rem; }
    .tab-bar { display:flex; gap:0.3rem; flex-wrap:wrap; margin-bottom:1rem; }
    .tab-bar button { padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer; font-weight:500; }
    .tab-bar button.active { background:#5b7a8c; color:#fff; border-color:#5b7a8c; }
    .controls { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.5rem; }
    select { padding:0.4rem 0.5rem; border-radius:8px; border:1px solid #ccc; }
    table { width:100%; border-collapse:collapse; margin-top:0.5rem; font-size:0.85rem; border: 1px solid #d0d7de; }
    th { background:#e9f0f3; padding:0.6rem; text-align:left; font-weight:600; border: 1px solid #d0d7de; }
    td { padding:0.5rem 0.6rem; border: 1px solid #d0d7de; }
    tr:last-child td { border-bottom: 1px solid #d0d7de; }
    .editable-cell { background:#fcfaf7; min-width:120px; outline:none; position:relative; border: 1px solid #d0d7de; }
    .editable-cell:focus { background:#fffdf8; outline:2px solid rgba(91,122,140,0.35); }
    .delete-btn { background:#f8d7da; border:none; padding:0.3rem 0.6rem; border-radius:6px; cursor:pointer; color:#b23b3b; font-weight:600; }
    .spinner { width:30px; height:30px; border:3px solid rgba(91,122,140,0.2); border-top-color:#5b7a8c; border-radius:50%; animation:spin 0.8s linear infinite; margin:2rem auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:#2d6a4f; color:#fff; padding:0.7rem 1.2rem; border-radius:10px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; }
    .toast.show { opacity:1; }
    .error { color:#b23b3b; margin-top:0.5rem; text-align:center; }
    .form-card label { display:block; margin-top:0.8rem; font-weight:600; font-size:0.9rem; }
    .form-card input, .form-card textarea { width:100%; padding:0.6rem; margin-top:0.3rem; border:1px solid #ddd; border-radius:8px; }
    .form-card textarea { min-height:80px; resize:vertical; }
    .pagination { display:flex; gap:0.3rem; margin-top:0.8rem; flex-wrap:wrap; align-items:center; }
    .pagination button { padding:0.3rem 0.6rem; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer; }
    .pagination button.active { background:#5b7a8c; color:#fff; border-color:#5b7a8c; }
    .pagination button:disabled { opacity:0.5; cursor:default; }

    /* Link wizard modal */
    .modal-overlay {
      position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 2000;
    }
    .modal-box {
      background: white; border-radius: 16px; padding: 1.5rem;
      max-width: 700px; width: 95%; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .modal-box h2 { margin-bottom:1rem; color: #5b7a8c; }
    .parent-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .parent-item {
      background: #f0f4f7; border-radius: 8px; padding: 0.6rem 1rem;
      cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 0.5rem;
    }
    .parent-item:hover { background: #e2e8f0; }
    .parent-item.selected { outline: 2px solid #5b7a8c; background: #e6eff3; }
    .parent-item img {
      width: 40px; height: 40px; object-fit: cover; border-radius: 4px; background: #ddd;
    }
    .product-check-list { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .product-check-item { display: flex; align-items: center; gap: 0.5rem; }
    .product-check-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
    .product-check-item label { font-size: 0.9rem; }
    .link-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="card">
    <h1>🔐 Trendrix Admin</h1>
    <input type="email" id="email" placeholder="Admin email" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;">Log in</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- DASHBOARD (hidden until login) -->
<div id="dashboard" class="hidden">
  <div class="card wide-card">
    <div class="top-bar">
      <h1>📊 Trendrix Admin</h1>
      <button class="btn danger small" id="logoutBtn">Log out</button>
    </div>
    <div class="tab-bar" id="tabBar">
      <button class="active" data-collection="product">🛍️ Product</button>
      <button data-collection="pinterest">📌 Pinterest</button>
      <button data-collection="piprMap">🔗 PIPR MAP</button>
      <button data-collection="instagram">📸 Instagram</button>
      <button data-collection="inprMap">🔗 INPR MAP</button>
    </div>
    <div id="tableContainer">
      <div class="spinner"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<!-- LINK WIZARD MODAL -->
<div id="linkWizardModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div id="linkWizardContent"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>
<script type="module">
  import { initializeApp } from "firebase/app";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";
  import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc } from "firebase/firestore";
  import { db as existingDb } from "./firebase-config.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGrnXhgeZpwPVA3-y0UN8UnqvZt_48nMw",
    authDomain: "trendrix-54.firebaseapp.com",
    projectId: "trendrix-54",
    storageBucket: "trendrix-54.firebasestorage.app",
    messagingSenderId: "739868376692",
    appId: "1:739868376692:web:65429fb612076cc64b5b21",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = existingDb;

  const collectionsMap = {
    product: {
      name: "Product",
      fields: ["Product Name","Affiliate Link","Image Link","Alt Image","Category","Source","Description"]
    },
    pinterest: {
      name: "Pinterest",
      fields: ["Alt Image","Link","Type"]
    },
    piprMap: {
      name: "PIPR MAP",
      fields: ["Pint ID","Product ID"],
      parentCollection: "Pinterest",
      parentIdField: "Pint ID"
    },
    instagram: {
      name: "Instagram",
      fields: ["Alt Image","Link","Thumbnail","Type"]
    },
    inprMap: {
      name: "INPR MAP",
      fields: ["INSTA ID","Product ID"],
      parentCollection: "Instagram",
      parentIdField: "INSTA ID"
    },
  };

  let currentCollection = "product";
  let currentDocs = [];
  let currentPage = 1;
  let recordsPerPage = 10;

  const loginScreen = document.getElementById("loginScreen");
  const dashboard = document.getElementById("dashboard");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");
  const logoutBtn = document.getElementById("logoutBtn");
  const tableContainer = document.getElementById("tableContainer");
  const toastEl = document.getElementById("toast");
  const tabBar = document.getElementById("tabBar");
  const linkWizardModal = document.getElementById("linkWizardModal");
  const linkWizardContent = document.getElementById("linkWizardContent");

  // ── Auth ──
  loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = err.message;
    }
  });

  logoutBtn.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.classList.add("hidden");
      dashboard.classList.remove("hidden");
      loadTable();
    } else {
      loginScreen.classList.remove("hidden");
      dashboard.classList.add("hidden");
    }
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  // ── Next‑ID logic (for single add) ──
  async function getNextId() {
    const collName = collectionsMap[currentCollection].name;
    const snap = await getDocs(collection(db, collName));
    let maxNum = 0;
    let bestPrefix = "";
    let bestPad = 1;
    const prefixCount = {};
    snap.forEach(d => {
      const m = d.id.match(/^(.*?)(\d+)$/);
      if (!m) return;
      const num = parseInt(m[2], 10);
      const p = m[1];
      const len = m[2].length;
      if (num > maxNum || (num === maxNum && len > bestPad)) {
        maxNum = num;
        bestPad = len;
      }
      prefixCount[p] = (prefixCount[p] || 0) + 1;
    });
    let bestCount = 0;
    for (const [p, cnt] of Object.entries(prefixCount)) {
      if (cnt > bestCount) { bestCount = cnt; bestPrefix = p; }
    }
    if (maxNum === 0) return "1";
    return bestPrefix + String(maxNum + 1).padStart(bestPad || 1, "0");
  }

  // Helper: generate an array of sequential IDs for the mapping collection
  async function generateNextMappingIds(count) {
    const collName = collectionsMap[currentCollection].name;
    const snap = await getDocs(collection(db, collName));
    let maxNum = 0;
    let prefix = "";
    let padLength = 1;
    snap.forEach(d => {
      const m = d.id.match(/^(.*?)(\d+)$/);
      if (!m) return;
      const num = parseInt(m[2], 10);
      const p = m[1];
      const len = m[2].length;
      if (num > maxNum || (num === maxNum && len > padLength)) {
        maxNum = num;
        prefix = p;
        padLength = len;
      }
    });
    const ids = [];
    let currentNum = maxNum + 1;
    for (let i = 0; i < count; i++) {
      ids.push(prefix + String(currentNum).padStart(padLength, '0'));
      currentNum++;
    }
    return ids;
  }

  // ── Load & render table ──
  async function loadTable() {
    tableContainer.innerHTML = '<div class="spinner"></div>';
    const coll = collectionsMap[currentCollection];
    try {
      const snap = await getDocs(collection(db, coll.name));
      currentDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      currentPage = 1;
      renderTable();
    } catch (err) {
      tableContainer.innerHTML = `<p class="error">Error: ${err.message}</p>`;
    }
  }

  function getUniqueCategories() {
    if (currentCollection !== "product" || !currentDocs.length) return [];
    const cats = new Set();
    currentDocs.forEach(doc => {
      const val = (doc["Category"] || "").trim();
      if (val) cats.add(val);
    });
    return Array.from(cats).sort();
  }

  function renderTable() {
    const coll = collectionsMap[currentCollection];
    const fields = coll.fields;
    if (currentDocs.length === 0) {
      let html = `<p>No documents yet.</p><button class="btn" id="addRowBtn">➕ Add First Row</button>`;
      if (currentCollection === "inprMap" || currentCollection === "piprMap") {
        html += `<button class="btn small secondary" id="showLinkWizardBtn" style="margin-left:0.5rem;">🛠️ Link Wizard</button>`;
      }
      tableContainer.innerHTML = html;
      document.getElementById("addRowBtn")?.addEventListener("click", addRow);
      document.getElementById("showLinkWizardBtn")?.addEventListener("click", openLinkWizard);
      return;
    }

    const totalRecords = currentDocs.length;
    const maxPage = Math.ceil(totalRecords / recordsPerPage);
    if (currentPage > maxPage) currentPage = maxPage;
    const startIdx = (currentPage - 1) * recordsPerPage;
    const endIdx = startIdx + (recordsPerPage === 0 ? totalRecords : recordsPerPage);
    const pageDocs = (recordsPerPage === 0) ? currentDocs : currentDocs.slice(startIdx, endIdx);

    const uniqueCategories = getUniqueCategories();

    let html = `<div class="controls">
      <div>
        <button class="btn small" id="addRowBtn">➕ Add Row</button>
        <button class="btn small secondary" id="showFormBtn" style="margin-left:0.5rem;">📝 Form</button>
        ${(currentCollection === "inprMap" || currentCollection === "piprMap") ? `<button class="btn small secondary" id="showLinkWizardBtn" style="margin-left:0.5rem;">🛠️ Link Wizard</button>` : ''}
      </div>
      <div style="display:flex; align-items:center; gap:0.3rem;">
        <label style="font-size:0.85rem;">Show:</label>
        <select id="recordsPerPageSelect">
          <option value="10" ${recordsPerPage === 10 ? "selected" : ""}>10</option>
          <option value="20" ${recordsPerPage === 20 ? "selected" : ""}>20</option>
          <option value="50" ${recordsPerPage === 50 ? "selected" : ""}>50</option>
          <option value="100" ${recordsPerPage === 100 ? "selected" : ""}>100</option>
          <option value="0" ${recordsPerPage === 0 ? "selected" : ""}>All</option>
        </select>
        <span style="font-size:0.85rem;">(Total: ${totalRecords})</span>
      </div>
    </div>`;

    html += `<table id="data-table"><thead><tr><th>ID</th>`;
    fields.forEach(f => html += `<th>${f}</th>`);
    html += `<th></th></tr></thead><tbody>`;

    pageDocs.forEach((doc, rowIdx) => {
      html += `<tr data-row="${rowIdx}">`;
      html += `<td class="doc-id-cell" data-col="0">${esc(doc.id)}</td>`;
      fields.forEach((f, colIdx) => {
        const col = colIdx + 1;
        html += `<td class="editable-cell" contenteditable="true" 
                    data-col="${col}" data-row="${rowIdx}" 
                    data-doc-id="${esc(doc.id)}" data-field="${f}">${esc(doc[f] || "")}</td>`;
      });
      html += `<td data-col="${fields.length+1}"><button class="delete-btn" data-doc-id="${esc(doc.id)}">🗑️</button></td>`;
      html += `</tr>`;
    });
    html += `</tbody></table>`;

    if (recordsPerPage > 0 && totalRecords > recordsPerPage) {
      html += `<div class="pagination">`;
      html += `<button id="prevPageBtn" ${currentPage === 1 ? "disabled" : ""}>Previous</button>`;
      const startPage = Math.max(1, currentPage - 2);
      const endPage = Math.min(maxPage, currentPage + 2);
      if (startPage > 1) html += `<button class="pageBtn" data-page="1">1</button> ...`;
      for (let p = startPage; p <= endPage; p++) {
        html += `<button class="pageBtn ${p === currentPage ? "active" : ""}" data-page="${p}">${p}</button>`;
      }
      if (endPage < maxPage) html += `... <button class="pageBtn" data-page="${maxPage}">${maxPage}</button>`;
      html += `<button id="nextPageBtn" ${currentPage === maxPage ? "disabled" : ""}>Next</button>`;
      html += `</div>`;
    }

    tableContainer.innerHTML = html;

    // Pagination events
    document.getElementById("recordsPerPageSelect")?.addEventListener("change", (e) => {
      recordsPerPage = parseInt(e.target.value);
      currentPage = 1;
      renderTable();
    });
    document.getElementById("prevPageBtn")?.addEventListener("click", () => {
      if (currentPage > 1) { currentPage--; renderTable(); }
    });
    document.getElementById("nextPageBtn")?.addEventListener("click", () => {
      if (currentPage < maxPage) { currentPage++; renderTable(); }
    });
    document.querySelectorAll(".pageBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentPage = parseInt(btn.dataset.page);
        renderTable();
      });
    });

    // Inline edit handlers
    tableContainer.querySelectorAll(".editable-cell").forEach(cell => {
      let orig = cell.textContent.trim();
      cell.addEventListener("focus", () => { orig = cell.textContent.trim(); });
      cell.addEventListener("blur", async () => {
        const val = cell.textContent.trim();
        if (val === orig) return;
        const docId = cell.dataset.docId;
        const field = cell.dataset.field;
        try {
          await updateDoc(doc(db, collectionsMap[currentCollection].name, docId), { [field]: val });
          showToast("Saved");
        } catch (err) {
          cell.textContent = orig;
          showToast("Error: " + err.message);
        }
      });
    });

    // Delete buttons
    tableContainer.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm(`Delete ${btn.dataset.docId}?`)) return;
        await deleteDoc(doc(db, collectionsMap[currentCollection].name, btn.dataset.docId));
        showToast("Deleted");
        loadTable();
      });
    });

    // Category dropdown (Product only)
    if (currentCollection === "product" && uniqueCategories.length > 0) {
      const datalistId = "categorySuggestionsList";
      let datalistEl = document.getElementById(datalistId);
      if (!datalistEl) {
        datalistEl = document.createElement("datalist");
        datalistEl.id = datalistId;
        document.body.appendChild(datalistEl);
      }
      datalistEl.innerHTML = uniqueCategories.map(c => `<option value="${esc(c)}">`).join("");
      const categoryCells = tableContainer.querySelectorAll('[data-field="Category"]');
      categoryCells.forEach(cell => {
        cell.addEventListener("focus", function(e) {
          if (this.querySelector("input")) return;
          const currentText = this.textContent.trim();
          const input = document.createElement("input");
          input.type = "text";
          input.setAttribute("list", datalistId);
          input.value = currentText;
          input.style.width = "100%";
          input.style.padding = "0.3rem";
          input.style.border = "1px solid #ccc";
          input.style.borderRadius = "4px";
          input.style.fontFamily = "inherit";
          input.style.fontSize = "0.85rem";
          this.textContent = "";
          this.appendChild(input);
          input.focus();
          input.addEventListener("blur", () => {
            this.textContent = input.value.trim() || "";
            this.dispatchEvent(new Event("blur", {bubbles: true}));
          });
          input.addEventListener("mousedown", e => e.stopPropagation());
        });
        cell.addEventListener("keydown", function(e) {
          if (this.querySelector("input")) e.stopPropagation();
        });
      });
    }

    // Arrow-key navigation
    const table = document.getElementById("data-table");
    if (table) {
      table.addEventListener("keydown", function(e) {
        const target = e.target;
        if (!target.classList.contains("editable-cell")) return;
        const key = e.key;
        if (!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(key)) return;
        e.preventDefault();
        const row = parseInt(target.dataset.row);
        const col = parseInt(target.dataset.col);
        if (isNaN(row) || isNaN(col)) return;
        let newRow = row, newCol = col;
        if (key === "ArrowUp") newRow = Math.max(0, row - 1);
        if (key === "ArrowDown") newRow = row + 1;
        if (key === "ArrowLeft") newCol = Math.max(1, col - 1);
        if (key === "ArrowRight") newCol = col + 1;
        const targetCell = table.querySelector(`tr[data-row="${newRow}"] td[data-col="${newCol}"]`);
        if (targetCell && targetCell.classList.contains("editable-cell")) {
          target.blur();
          targetCell.focus();
        }
      });
    }

    document.getElementById("addRowBtn")?.addEventListener("click", addRow);
    document.getElementById("showFormBtn")?.addEventListener("click", showForm);
    document.getElementById("showLinkWizardBtn")?.addEventListener("click", openLinkWizard);
  }

  async function addRow() {
    const fields = collectionsMap[currentCollection].fields;
    const nextId = await getNextId();
    try {
      await setDoc(doc(db, collectionsMap[currentCollection].name, nextId),
        Object.fromEntries(fields.map(f => [f, ""])));
      showToast(`Added ${nextId}`);
      loadTable();
    } catch (err) {
      showToast("Error: " + err.message);
    }
  }

  function showForm() {
    const fields = collectionsMap[currentCollection].fields;
    let formHtml = `<h3>Add ${currentCollection}</h3><div class="form-card">`;
    formHtml += `<label>Document ID <span style="color:#b23b3b;">*</span></label><input id="formDocId" placeholder="e.g. PA0002" />`;
    fields.forEach(f => {
      formHtml += `<label>${f}</label><input id="form_${f.replace(/\s/g,"_")}" />`;
    });
    formHtml += `<button class="btn" id="submitFormBtn" style="margin-top:1rem;">💾 Save</button></div>`;
    tableContainer.innerHTML = formHtml;
    getNextId().then(id => { document.getElementById("formDocId").value = id; });
    document.getElementById("submitFormBtn").addEventListener("click", async () => {
      const docId = document.getElementById("formDocId").value.trim();
      if (!docId) { showToast("Document ID required"); return; }
      const payload = {};
      fields.forEach(f => {
        payload[f] = document.getElementById(`form_${f.replace(/\s/g,"_")}`).value;
      });
      try {
        await setDoc(doc(db, collectionsMap[currentCollection].name, docId), payload);
        showToast(`Saved ${docId}`);
        loadTable();
      } catch (err) {
        showToast("Error: " + err.message);
      }
    });
  }

  // ── Link Wizard ──
  function openLinkWizard() {
    linkWizardModal.classList.remove("hidden");
    const mappingCollection = collectionsMap[currentCollection];
    const parentCollectionName = mappingCollection.parentCollection;
    const parentIdField = mappingCollection.parentIdField;

    linkWizardContent.innerHTML = `<h2>Link Wizard: ${mappingCollection.name}</h2><div class="spinner"></div>`;

    (async () => {
      try {
        // Fetch parent collection (Instagram or Pinterest)
        const parentSnap = await getDocs(collection(db, parentCollectionName));
        const parents = parentSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        // Fetch all products
        const productSnap = await getDocs(collection(db, "Product"));
        const products = productSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        // Determine which image field to use for thumbnail
        let parentImageField = "Thumbnail"; // default for Instagram
        if (parentCollectionName === "Pinterest") {
          // Pinterest collection has "Alt Image" and "Link". Use the first that is a plausible image URL.
          parentImageField = "Alt Image";
        }

        // Render step 1: select parent
        let parentHtml = `<h3>Select a ${parentCollectionName} item</h3>`;
        parentHtml += `<div class="parent-list">`;
        parents.forEach(p => {
          const label = p.id + (p["Type"] ? ` (${p["Type"]})` : "");
          const imgSrc = p[parentImageField] || p["image"] || p["link"] || "";
          const imgTag = imgSrc ? `<img src="${esc(imgSrc)}" onerror="this.style.display='none'" alt="">` : '';
          parentHtml += `<div class="parent-item" data-parent-id="${esc(p.id)}">
            ${imgTag}
            <span>${esc(label)}</span>
          </div>`;
        });
        parentHtml += `</div>`;
        parentHtml += `<div id="productSelectionArea" style="display:none;">`;
        parentHtml += `<h3>Select Products to link</h3>`;
        parentHtml += `<div class="product-check-list" id="productList"></div>`;
        parentHtml += `<div class="link-actions"><button class="btn" id="linkSelectedBtn">🔗 Link Selected Products</button></div>`;
        parentHtml += `</div>`;

        linkWizardContent.innerHTML = parentHtml;

        let selectedParentId = null;

        // Parent click handler
        document.querySelectorAll(".parent-item").forEach(item => {
          item.addEventListener("click", () => {
            document.querySelectorAll(".parent-item").forEach(i => i.classList.remove("selected"));
            item.classList.add("selected");
            selectedParentId = item.dataset.parentId;

            // Show product selection
            const productArea = document.getElementById("productSelectionArea");
            productArea.style.display = "block";
            const productList = document.getElementById("productList");
            productList.innerHTML = products.map(prod => `
              <div class="product-check-item">
                <input type="checkbox" id="prod_${esc(prod.id)}" value="${esc(prod.id)}">
                <img src="${esc(prod["Image Link"] || "")}" onerror="this.style.display='none'" alt="">
                <label for="prod_${esc(prod.id)}">${esc(prod["Product Name"] || prod.id)}</label>
              </div>
            `).join("");
          });
        });

        // Link button
        document.getElementById("linkSelectedBtn")?.addEventListener("click", async () => {
          if (!selectedParentId) {
            showToast("Please select a parent first.");
            return;
          }
          const checkboxes = document.querySelectorAll(".product-check-item input[type='checkbox']:checked");
          if (checkboxes.length === 0) {
            showToast("Select at least one product.");
            return;
          }
          const selectedProductIds = Array.from(checkboxes).map(cb => cb.value);

          try {
            // Generate continuous IDs for the mapping documents
            const nextIds = await generateNextMappingIds(selectedProductIds.length);
            const collName = collectionsMap[currentCollection].name;
            for (let i = 0; i < selectedProductIds.length; i++) {
              const productId = selectedProductIds[i];
              const mappingId = nextIds[i];
              const payload = {
                [parentIdField]: selectedParentId,
                "Product ID": productId
              };
              await setDoc(doc(db, collName, mappingId), payload);
            }
            showToast(`Linked ${selectedProductIds.length} product(s) to ${selectedParentId}`);
            linkWizardModal.classList.add("hidden");
            loadTable();
          } catch (err) {
            showToast("Error: " + err.message);
          }
        });
      } catch (err) {
        linkWizardContent.innerHTML += `<p class="error">Error loading data: ${err.message}</p>`;
      }
    })();
  }

  // Close modal on click outside
  linkWizardModal.addEventListener("click", (e) => {
    if (e.target === linkWizardModal) {
      linkWizardModal.classList.add("hidden");
    }
  });

  // ── Tab switching ──
  tabBar.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    tabBar.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentCollection = e.target.dataset.collection;
    recordsPerPage = 10;
    currentPage = 1;
    loadTable();
  });

  function esc(s) {
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
