<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendrix Admin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:#f7f4f0; color:#2e2e2e; min-height:100vh; }
    .hidden { display:none !important; }
    #loginScreen, #dashboard { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
    .card { background:#fff; border-radius:20px; padding:1.5rem; box-shadow:0 6px 20px rgba(0,0,0,0.08); width:100%; max-width:500px; }
    .wide-card { max-width:950px; }
    h1 { color:#5b7a8c; text-align:center; margin-bottom:1rem; }
    h2 { margin-bottom:0.5rem; }
    input, button, select, textarea { font-family:inherit; }
    input[type="email"], input[type="password"] { width:100%; padding:0.8rem; border:1px solid #ddd; border-radius:12px; margin-bottom:0.8rem; }
    .btn { display:inline-block; padding:0.7rem 1.4rem; background:#5b7a8c; color:#fff; border:none; border-radius:10px; font-weight:600; cursor:pointer; text-decoration:none; text-align:center; }
    .btn:hover { background:#3d5660; }
    .btn.small { padding:0.4rem 0.9rem; font-size:0.85rem; }
    .btn.danger { background:#b23b3b; }
    .btn.danger:hover { background:#8f2e2e; }
    .btn.secondary { background:#6e6e6e; }
    .btn.secondary:hover { background:#555; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1.5rem; }
    select { padding:0.5rem; border-radius:8px; border:1px solid #ddd; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; font-size:0.85rem; }
    th { background:#e9f0f3; padding:0.6rem; text-align:left; font-weight:600; }
    td { padding:0.5rem 0.6rem; border-bottom:1px solid #f0ede8; }
    tr:last-child td { border-bottom:none; }
    .editable-cell { background:#fcfaf7; min-width:120px; outline:none; }
    .editable-cell:focus { background:#fffdf8; outline:2px solid rgba(91,122,140,0.35); }
    .delete-btn { background:#f8d7da; border:none; padding:0.3rem 0.6rem; border-radius:6px; cursor:pointer; color:#b23b3b; font-weight:600; }
    .spinner { width:30px; height:30px; border:3px solid rgba(91,122,140,0.2); border-top-color:#5b7a8c; border-radius:50%; animation:spin 0.8s linear infinite; margin:2rem auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:#2d6a4f; color:#fff; padding:0.7rem 1.2rem; border-radius:10px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; }
    .toast.show { opacity:1; }
    .error { color:#b23b3b; margin-top:0.5rem; text-align:center; }
    .form-card label { display:block; margin-top:0.8rem; font-weight:600; font-size:0.9rem; }
    .form-card input, .form-card textarea { width:100%; padding:0.6rem; margin-top:0.3rem; border:1px solid #ddd; border-radius:8px; }
    .form-card textarea { min-height:80px; resize:vertical; }
    .tab-bar { display:flex; gap:0.3rem; flex-wrap:wrap; margin-bottom:1rem; }
    .tab-bar button { padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer; font-weight:500; }
    .tab-bar button.active { background:#5b7a8c; color:#fff; border-color:#5b7a8c; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="card">
    <h1>🔐 Trendrix Admin</h1>
    <input type="email" id="email" placeholder="Admin email" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;">Log in</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- DASHBOARD (hidden until login) -->
<div id="dashboard" class="hidden">
  <div class="card wide-card">
    <div class="top-bar">
      <h1>📊 Trendrix Admin</h1>
      <button class="btn danger small" id="logoutBtn">Log out</button>
    </div>
    <div class="tab-bar" id="tabBar">
      <button class="active" data-collection="product">🛍️ Product</button>
      <button data-collection="pinterest">📌 Pinterest</button>
      <button data-collection="piprMap">🔗 PIPR MAP</button>
      <button data-collection="instagram">📸 Instagram</button>
      <button data-collection="inprMap">🔗 INPR MAP</button>
    </div>
    <div id="tableContainer">
      <div class="spinner"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>
<script type="module">
  import { initializeApp } from "firebase/app";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";
  import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc } from "firebase/firestore";
  import { db as existingDb } from "./firebase-config.js";  // reuse your existing db

  // Firebase config (client-safe, same as your website)
  const firebaseConfig = {
    apiKey: "AIzaSyCGrnXhgeZpwPVA3-y0UN8UnqvZt_48nMw",
    authDomain: "trendrix-54.firebaseapp.com",
    projectId: "trendrix-54",
    storageBucket: "trendrix-54.firebasestorage.app",
    messagingSenderId: "739868376692",
    appId: "1:739868376692:web:65429fb612076cc64b5b21",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = existingDb;  // use the same Firestore instance from your config

  // ========== built‑in collections (same as server.js) ==========
  const collectionsMap = {
    product: {
      name: "Product",
      fields: ["Product Name","Affiliate Link","Image Link","Alt Image","Category","Source","Description"]
    },
    pinterest: {
      name: "Pinterest",
      fields: ["Alt Image","Link","Type"]
    },
    piprMap: {
      name: "PIPR MAP",
      fields: ["Pint ID","Product ID"]
    },
    instagram: {
      name: "Instagram",
      fields: ["Alt Image","Link","Thumbnail","Type"]
    },
    inprMap: {
      name: "INPR MAP",
      fields: ["INSTA ID","Product ID"]
    },
  };

  let currentCollection = "product";
  let currentDocs = [];

  const loginScreen = document.getElementById("loginScreen");
  const dashboard = document.getElementById("dashboard");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");
  const logoutBtn = document.getElementById("logoutBtn");
  const tableContainer = document.getElementById("tableContainer");
  const toast = document.getElementById("toast");
  const tabBar = document.getElementById("tabBar");

  // ========== Auth ==========
  loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = err.message;
    }
  });

  logoutBtn.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.classList.add("hidden");
      dashboard.classList.remove("hidden");
      loadTable();
    } else {
      loginScreen.classList.remove("hidden");
      dashboard.classList.add("hidden");
    }
  });

  // ========== Toast ==========
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  }

  // ========== Next‑ID logic (same as server.js) ==========
  async function getNextId() {
    const collName = collectionsMap[currentCollection].name;
    const snap = await getDocs(collection(db, collName));
    let maxNum = 0;
    let bestPrefix = "";
    let bestPad = 1;
    const prefixCount = {};
    snap.forEach(d => {
      const m = d.id.match(/^(.*?)(\d+)$/);
      if (!m) return;
      const num = parseInt(m[2], 10);
      const p = m[1];
      const len = m[2].length;
      if (num > maxNum || (num === maxNum && len > bestPad)) {
        maxNum = num;
        bestPad = len;
      }
      prefixCount[p] = (prefixCount[p] || 0) + 1;
    });
    // Most common prefix
    let bestCount = 0;
    for (const [p, cnt] of Object.entries(prefixCount)) {
      if (cnt > bestCount) { bestCount = cnt; bestPrefix = p; }
    }
    if (maxNum === 0) return "1";
    return bestPrefix + String(maxNum + 1).padStart(bestPad || 1, "0");
  }

  // ========== Load & render table ==========
  async function loadTable() {
    tableContainer.innerHTML = '<div class="spinner"></div>';
    const coll = collectionsMap[currentCollection];
    try {
      const snap = await getDocs(collection(db, coll.name));
      currentDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTable();
    } catch (err) {
      tableContainer.innerHTML = `<p class="error">Error: ${err.message}</p>`;
    }
  }

  function renderTable() {
    const coll = collectionsMap[currentCollection];
    const fields = coll.fields;
    if (currentDocs.length === 0) {
      tableContainer.innerHTML = `<p>No documents yet.</p><button class="btn" id="addRowBtn">➕ Add First Row</button>`;
      document.getElementById("addRowBtn")?.addEventListener("click", addRow);
      return;
    }
    let html = `<button class="btn small" id="addRowBtn">➕ Add Row</button>`;
    html += `<button class="btn small secondary" id="showFormBtn" style="margin-left:0.5rem;">📝 Form</button>`;
    html += `<table><thead><tr><th>ID</th>`;
    fields.forEach(f => html += `<th>${f}</th>`);
    html += `<th></th></tr></thead><tbody>`;
    currentDocs.forEach(doc => {
      html += `<tr>`;
      html += `<td style="font-weight:600;">${esc(doc.id)}</td>`;
      fields.forEach(f => {
        html += `<td class="editable-cell" contenteditable data-doc-id="${esc(doc.id)}" data-field="${f}">${esc(doc[f] || "")}</td>`;
      });
      html += `<td><button class="delete-btn" data-doc-id="${esc(doc.id)}">🗑️</button></td>`;
      html += `</tr>`;
    });
    html += `</tbody></table>`;
    tableContainer.innerHTML = html;

    // Inline edit
    tableContainer.querySelectorAll(".editable-cell").forEach(cell => {
      let orig = cell.textContent.trim();
      cell.addEventListener("focus", () => { orig = cell.textContent.trim(); });
      cell.addEventListener("blur", async () => {
        const val = cell.textContent.trim();
        if (val === orig) return;
        const docId = cell.dataset.docId;
        const field = cell.dataset.field;
        try {
          await updateDoc(doc(db, collectionsMap[currentCollection].name, docId), { [field]: val });
          showToast("Saved");
        } catch (err) {
          cell.textContent = orig;
          showToast("Error: " + err.message);
        }
      });
    });

    // Delete
    tableContainer.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const docId = btn.dataset.docId;
        if (!confirm(`Delete ${docId}?`)) return;
        await deleteDoc(doc(db, collectionsMap[currentCollection].name, docId));
        showToast("Deleted");
        loadTable();
      });
    });

    document.getElementById("addRowBtn")?.addEventListener("click", addRow);
    document.getElementById("showFormBtn")?.addEventListener("click", showForm);
  }

  // ========== Add Row (with next‑ID) ==========
  async function addRow() {
    const fields = collectionsMap[currentCollection].fields;
    const nextId = await getNextId();
    const newRow = { id: nextId };
    fields.forEach(f => newRow[f] = "");
    try {
      await setDoc(doc(db, collectionsMap[currentCollection].name, nextId), Object.fromEntries(fields.map(f => [f, ""])));
      showToast(`Added ${nextId}`);
      loadTable();
    } catch (err) {
      showToast("Error: " + err.message);
    }
  }

  // ========== Simple Form (like server.js add forms) ==========
  function showForm() {
    const fields = collectionsMap[currentCollection].fields;
    let formHtml = `<h3>Add ${currentCollection}</h3>`;
    formHtml += `<div class="form-card">`;
    formHtml += `<label>Document ID <span style="color:#b23b3b;">*</span></label><input id="formDocId" placeholder="e.g. PA0002" />`;
    fields.forEach(f => {
      formHtml += `<label>${f}</label><input id="form_${f.replace(/\s/g,"_")}" />`;
    });
    formHtml += `<button class="btn" id="submitFormBtn" style="margin-top:1rem;">💾 Save</button>`;
    formHtml += `</div>`;
    tableContainer.innerHTML = formHtml;

    // Suggest next ID
    getNextId().then(id => { document.getElementById("formDocId").value = id; });

    document.getElementById("submitFormBtn").addEventListener("click", async () => {
      const docId = document.getElementById("formDocId").value.trim();
      if (!docId) { showToast("Document ID required"); return; }
      const payload = {};
      fields.forEach(f => {
        payload[f] = document.getElementById(`form_${f.replace(/\s/g,"_")}`).value;
      });
      try {
        await setDoc(doc(db, collectionsMap[currentCollection].name, docId), payload);
        showToast(`Saved ${docId}`);
        loadTable();
      } catch (err) {
        showToast("Error: " + err.message);
      }
    });
  }

  // ========== Tab switching ==========
  tabBar.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    tabBar.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentCollection = e.target.dataset.collection;
    loadTable();
  });

  function esc(s) {
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
