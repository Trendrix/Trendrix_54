    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --main-color: #5b7a8c;
            --bg-color: #f7f4f0;
            --card-bg: #ffffff;
            --text-color: #2e2e2e;
            --muted-color: #5a5a5a;
            --radius: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);
            --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* Pagination buttons */
        .pag-btn {
            padding: 0.5rem 1rem;
            border: 1.5px solid var(--main-color);
            background: white;
            color: var(--main-color);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .pag-btn:hover:not(:disabled) {
            background: var(--main-color);
            color: white;
        }
        .pag-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* Toggle button */
        .toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: rgba(255,252,248,0.8);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(180,155,110,0.3);
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--main-color);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(91,80,60,0.08);
        }
        .toggle-btn:hover {
            background: rgba(255,252,248,1);
            border-color: var(--main-color);
            box-shadow: 0 4px 18px rgba(201,169,110,0.2);
            transform: translateY(-1px);
        }
        .toggle-btn:active { transform: scale(0.97); }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(240, 148, 51, 0.03), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(188, 24, 136, 0.03), transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(220, 39, 67, 0.02), transparent 50%);
            animation: gradientMove 15s ease infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientMove {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 50px) scale(0.9);
            }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--main-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: particleFloat 8s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            50% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--x-distance)) scale(1);
                opacity: 0;
            }
        }

        /* Sparkle animation */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 20px;
            height: 20px;
            animation: sparkleAnim 1.2s ease-out forwards;
        }

        .sparkle::before,
        .sparkle::after {
            content: '';
            position: absolute;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            border-radius: 50%;
        }

        .sparkle::before {
            width: 4px;
            height: 4px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .sparkle::after {
            width: 8px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        @keyframes sparkleAnim {
            0% {
                transform: translate(var(--x), var(--y)) scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1.5) rotate(180deg);
                opacity: 0;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 2rem 3rem;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeInDown 0.8s ease;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            animation: gradientShift 3s ease infinite, titleFloat 4s ease-in-out infinite;
            background-size: 200% 200%;
            position: relative;
        }

        .hero h1::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(240, 148, 51, 0.1), transparent 70%);
            animation: pulse 3s ease-in-out infinite;
            z-index: -1;
            border-radius: 50%;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes titleFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--muted-color);
            font-weight: 400;
            animation: fadeInUp 1s ease 0.3s backwards;
        }

        .insta-icon {
            display: inline-block;
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            position: relative;
            animation: iconPulse 2s ease-in-out infinite;
        }

        .insta-icon::before,
        .insta-icon::after {
            content: '';
            position: absolute;
            border-radius: 12px;
        }

        .insta-icon::before {
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            background: var(--insta-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: iconRotate 8s linear infinite;
        }

        .insta-icon::after {
            width: 20px;
            height: 20px;
            background: var(--insta-gradient);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes iconRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        .layout-mode-instagram {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 1.5rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(91, 122, 140, 0.1);
            border-top-color: #f09433;
            border-right-color: #dc2743;
            border-bottom-color: #bc1888;
            border-left-color: #e6683c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite, colorShift 3s ease infinite;
        }

        @keyframes colorShift {
            0%, 100% {
                filter: hue-rotate(0deg);
            }
            50% {
                filter: hue-rotate(45deg);
            }
        }

        .loading-text {
            font-size: 1.1rem;
            color: var(--muted-color);
            font-weight: 500;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted-color);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Instagram Posts Grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        body[data-layout-mode="compact"] .posts-grid {
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
        }
        body[data-layout-mode="compact"] .post-actions {
            padding: 1rem;
            gap: 0.55rem;
        }
        body[data-layout-mode="compact"] .btn {
            padding: 0.62rem 1rem;
            font-size: 0.88rem;
        }
        body[data-layout-mode="compact"] .post-badge {
            font-size: 0.74rem;
            padding: 0.3rem 0.55rem;
        }

        body[data-layout-mode="full"] .posts-grid {
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2.4rem;
        }
        body[data-layout-mode="full"] .post-actions {
            padding: 1.8rem;
            gap: 0.9rem;
        }
        body[data-layout-mode="full"] .btn {
            padding: 0.88rem 1.7rem;
            font-size: 1rem;
        }
        body[data-layout-mode="full"] .post-badge {
            font-size: 0.95rem;
            padding: 0.5rem 0.95rem;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
            position: relative;
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
            z-index: 1;
            pointer-events: none;
        }

        .post-card:hover::before {
            left: 100%;
        }

        .post-card:nth-child(1) { animation-delay: 0.1s; }
        .post-card:nth-child(2) { animation-delay: 0.2s; }
        .post-card:nth-child(3) { animation-delay: 0.3s; }
        .post-card:nth-child(4) { animation-delay: 0.4s; }
        .post-card:nth-child(5) { animation-delay: 0.5s; }
        .post-card:nth-child(6) { animation-delay: 0.6s; }
        .post-card:nth-child(n+7) { animation-delay: 0.7s; }

        .post-card:hover {
            transform: translateY(-12px) rotateZ(0.5deg);
            box-shadow: 0 20px 40px rgba(91, 122, 140, 0.25);
        }

        .post-thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #f7f4f0 0%, #e8e4df 100%);
        }

        .post-thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .post-card:hover .post-thumbnail {
            transform: scale(1.08);
        }

        .post-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        .post-badge.reel {
            background: var(--insta-gradient);
            animation: badgePulse 2s ease-in-out infinite, shimmer 3s linear infinite;
        }

        @keyframes badgePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        .post-actions {
            padding: 1.5rem;
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--main-color);
            color: var(--main-color);
        }

        .btn-outline:hover {
            background: var(--main-color);
            color: white;
            transform: scale(0.98);
            animation: wiggle 0.5s ease;
        }

        .btn-filled {
            background: var(--text-color);
            color: white;
            border: 2px solid var(--text-color);
            position: relative;
            overflow: hidden;
        }

        .btn-filled::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-filled:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-filled:hover {
            background: var(--main-color);
            border-color: var(--main-color);
            transform: scale(0.98);
            animation: wiggle 0.5s ease;
        }

        @keyframes wiggle {
            0%, 100% { transform: scale(0.98) rotate(0deg); }
            25% { transform: scale(0.98) rotate(-2deg); }
            75% { transform: scale(0.98) rotate(2deg); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        .modal-overlay.closing {
            animation: fadeOut 0.3s ease forwards;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: scale(0.9);
            opacity: 0;
            animation: modalEnter 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .modal-overlay.closing .modal {
            animation: modalExit 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid rgba(91, 122, 140, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 1.75rem;
            color: var(--main-color);
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--muted-color);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 0, 0, 0.1);
            color: #ff0000;
            transform: rotate(90deg) scale(1.1);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(90deg) scale(1.1) translateX(0); }
            25% { transform: rotate(90deg) scale(1.1) translateX(-3px); }
            75% { transform: rotate(90deg) scale(1.1) translateX(3px); }
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem;
            gap: 1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--bg-color);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px) rotate(-1deg);
            border-color: var(--main-color);
            box-shadow: var(--shadow-md);
            animation: wiggleCard 0.5s ease;
        }

        @keyframes wiggleCard {
            0%, 100% { transform: translateY(-4px) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-1deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
            75% { transform: translateY(-4px) rotate(-1deg); }
        }

        .product-image-wrapper {
            width: 100%;
            padding-top: 100%;
            position: relative;
            overflow: hidden;
            background: white;
        }

        .product-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1rem;
            text-align: center;
        }

        .product-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
            margin-bottom: 0.75rem;
            line-height: 1.4;
            min-height: 2.8em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-btn {
            width: 100%;
            padding: 0.65rem 1.25rem;
            background: var(--main-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .product-btn:hover {
            background: var(--text-color);
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(91, 122, 140, 0.3);
        }

        .product-btn:active {
            animation: bounce 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(0.97); }
            50% { transform: scale(0.92); }
        }

        .empty-products {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--muted-color);
        }

        .empty-products-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            background: var(--card-bg);
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(91, 122, 140, 0.1);
            margin-top: 4rem;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-tagline {
            color: var(--main-color);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .footer-copyright {
            color: var(--muted-color);
            font-size: 0.95rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalEnter {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes modalExit {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.9); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav { padding: 1rem; }
            .nav-links { gap: 1rem; font-size: 0.9rem; }
            .brand { font-size: 1.25rem; }
            .hero { padding: 3rem 1.5rem 2rem; }
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .container { padding: 1rem; }
            .posts-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1.5rem;
            }
            body[data-layout-mode="compact"] .posts-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            body[data-layout-mode="medium"] .posts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            body[data-layout-mode="full"] .posts-grid { grid-template-columns: 1fr; }
            .post-actions { flex-direction: column; }
            .btn { width: 100%; }
            .modal { width: 98%; max-height: 95vh; }
            .modal-header { padding: 1.5rem; }
            .modal-header h2 { font-size: 1.4rem; }
            .modal-body { padding: 1.5rem; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
        }

        @media (max-width: 480px) {
            .nav-links { gap: 0.75rem; font-size: 0.85rem; }
            .hero h1 { font-size: 1.75rem; }
            .posts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
            body[data-layout-mode="compact"] .posts-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55rem; }
            body[data-layout-mode="compact"] .post-actions { padding: 0.55rem; gap: 0.45rem; }
            body[data-layout-mode="compact"] .btn { padding: 0.45rem 0.5rem; font-size: 0.74rem; }
            body[data-layout-mode="compact"] .post-badge { font-size: 0.62rem; padding: 0.2rem 0.36rem; }
            body[data-layout-mode="medium"] .posts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            body[data-layout-mode="full"] .posts-grid { grid-template-columns: 1fr; }
            .products-grid { grid-template-columns: 1fr; }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--main-color); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-color); }
    </style>
</head>
<body>
    <!-- Shared Navigation -->
    <div id="txNavHost"></div>

    <!-- Hero Section -->
    <div class="hero tx-page-pad">
        <div class="insta-icon"></div>
        <h1>Instagram Shop</h1>
        <p>Watch reels, shop the look</p>
    </div>
    <div class="tx-layout-control-wrap layout-mode-instagram">
        <div id="layoutModeHost"></div>
        <button id="orderToggleBtn" class="toggle-btn">🔀 Random</button>
    </div>

    <!-- Main Content -->
    <div class="container tx-first-content">
        <div id="postsContainer">
            <!-- Loading state -->
            <div class="loading-container">
                <div class="spinner"></div>
                <p class="loading-text">Loading inspiring posts...</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2>Shop this look</h2>
                <button class="close-btn" id="closeModal" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading products...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="txFooterHost"></div>

    <!-- Firebase SDK -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
        }
    }
    </script>

    <script type="module">
        import { collection, getDocs, query, where, doc, getDoc } from 'firebase/firestore';
        import { db } from './firebase-config.js';
        import { mountSharedNav } from './assets/shared-nav.js';
        import { initLayoutMode } from './assets/layout-mode.mjs';

        mountSharedNav({ active: 'instagram.html' });
        initLayoutMode({
            hostId: 'layoutModeHost',
            storageKey: 'trendrix:layout:instagram',
            target: document.body,
            defaultMode: 'medium'
        });

        /* ── DOM refs ── */
        const postsContainer = document.getElementById('postsContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModal');
        const orderToggleBtn = document.getElementById('orderToggleBtn');

        let allPosts = [];
        let linkedInstaIds = new Set();         // Instagram IDs that have product links
        let randomOrder = true;                 // default random
        const POSTS_PER_PAGE = 24;
        let currentPage = 1;
        let currentSortedPosts = [];            // currently displayed (filtered/sorted) after toggle

        /* ── Fetch all data (Instagram + INPR MAP) ── */
        async function fetchData() {
            try {
                // Fetch Instagram collection
                const instaSnap = await getDocs(collection(db, 'Instagram'));
                allPosts = instaSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Fetch product mappings to determine which posts are linked
                const mapSnap = await getDocs(collection(db, 'INPR MAP'));
                mapSnap.docs.forEach(doc => {
                    const instaId = doc.data()['INSTA ID'];
                    if (instaId) linkedInstaIds.add(instaId);
                });

                if (allPosts.length === 0) {
                    showEmptyState();
                    return;
                }

                applySortAndRender();
            } catch (error) {
                console.error('Error fetching data:', error);
                showErrorState();
            }
        }

        /* ── Sorting logic (linked first, then ordered/random per toggle) ── */
        function applySortAndRender() {
            // Split posts into linked and unlinked
            const linked = [];
            const unlinked = [];
            allPosts.forEach(post => {
                if (linkedInstaIds.has(post.id)) {
                    linked.push(post);
                } else {
                    unlinked.push(post);
                }
            });

            // Sort each group based on toggle
            if (randomOrder) {
                // Fisher–Yates shuffle for each group
                shuffleArray(linked);
                shuffleArray(unlinked);
            } else {
                // Order by document ID (ascending)
                linked.sort((a, b) => String(a.id).localeCompare(String(b.id)));
                unlinked.sort((a, b) => String(a.id).localeCompare(String(b.id)));
            }

            // Concatenate: linked first, then unlinked
            currentSortedPosts = linked.concat(unlinked);
            currentPage = 1;
            renderPage();
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        /* ── Render current page ── */
        function renderPage() {
            const totalPages = Math.ceil(currentSortedPosts.length / POSTS_PER_PAGE);
            const safePage = Math.min(currentPage, totalPages);
            const start = (safePage - 1) * POSTS_PER_PAGE;
            const pagePosts = currentSortedPosts.slice(start, start + POSTS_PER_PAGE);

            const grid = document.createElement('div');
            grid.className = 'posts-grid';
            pagePosts.forEach((post, index) => {
                const card = createPostCard(post, index);
                grid.appendChild(card);
            });

            postsContainer.innerHTML = '';
            postsContainer.appendChild(grid);

            // Pagination
            renderPagination(totalPages, safePage);
        }

        function renderPagination(totalPages, current) {
            let pagEl = document.getElementById('paginationContainer');
            if (!pagEl) {
                pagEl = document.createElement('div');
                pagEl.id = 'paginationContainer';
                pagEl.style.cssText = 'display:flex; gap:0.5rem; justify-content:center; margin-top:1.5rem; flex-wrap:wrap;';
                postsContainer.appendChild(pagEl);   // append after grid
            }

            if (totalPages <= 1) {
                pagEl.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button class="pag-btn" data-page="1" ${current === 1 ? 'disabled' : ''}>First</button>`;
            html += `<button class="pag-btn" data-page="${Math.max(1, current - 1)}" ${current === 1 ? 'disabled' : ''}>Prev</button>`;

            for (let p = Math.max(1, current - 2); p <= Math.min(totalPages, current + 2); p++) {
                html += `<button class="pag-btn" data-page="${p}" ${p === current ? 'disabled' : ''}>${p}</button>`;
            }

            html += `<button class="pag-btn" data-page="${Math.min(totalPages, current + 1)}" ${current === totalPages ? 'disabled' : ''}>Next</button>`;
            html += `<button class="pag-btn" data-page="${totalPages}" ${current === totalPages ? 'disabled' : ''}>Last</button>`;

            pagEl.innerHTML = html;

            pagEl.querySelectorAll('.pag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = parseInt(btn.dataset.page);
                    if (!isNaN(page)) {
                        currentPage = page;
                        renderPage();
                        window.scrollTo({ top: document.querySelector('.posts-grid').offsetTop - 120, behavior: 'smooth' });
                    }
                });
            });
        }

        /* ── Create a post card (WITHOUT like button) ── */
        function createPostCard(post, index) {
            const card = document.createElement('div');
            card.className = 'post-card';

            const thumbnailWrapper = document.createElement('div');
            thumbnailWrapper.className = 'post-thumbnail-wrapper';

            const img = document.createElement('img');
            img.className = 'post-thumbnail';
            img.src = post['Thumbnail'] || post.thumbnail || 'https://via.placeholder.com/400x400?text=Instagram+Post';
            img.alt = post['Alt Image'] || post.altImage || 'Instagram post';
            img.loading = 'lazy';

            const badge = document.createElement('div');
            const type = post['Type'] || post.type || 'Post';
            badge.className = `post-badge ${String(type).toLowerCase() === 'reel' ? 'reel' : ''}`;
            badge.textContent = String(type).toLowerCase() === 'reel' ? 'REEL' : 'POST';

            thumbnailWrapper.appendChild(img);
            thumbnailWrapper.appendChild(badge);

            const actions = document.createElement('div');
            actions.className = 'post-actions';

            const watchBtn = document.createElement('a');
            watchBtn.className = 'btn btn-outline';
            watchBtn.href = post['Link'] || post.link || '#';
            watchBtn.target = '_blank';
            watchBtn.rel = 'noopener noreferrer';
            watchBtn.textContent = String(type).toLowerCase() === 'reel' ? '▶ Watch Reel' : '👀 View Post';

            const shopBtn = document.createElement('button');
            shopBtn.className = 'btn btn-filled';
            shopBtn.textContent = '🛍️ Buy Products';
            shopBtn.onclick = () => openProductModal(post.id);

            actions.appendChild(watchBtn);
            actions.appendChild(shopBtn);

            card.appendChild(thumbnailWrapper);
            card.appendChild(actions);

            return card;
        }

        /* ── Modal logic (unchanged) ── */
        async function openProductModal(instaId) {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            modalBody.innerHTML = `
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading products...</p>
                </div>
            `;

            try {
                const mappingQuery = query(
                    collection(db, 'INPR MAP'),
                    where('INSTA ID', '==', instaId)
                );
                const mappingSnapshot = await getDocs(mappingQuery);
                const productIds = mappingSnapshot.docs.map(doc => doc.data()['Product ID']).filter(Boolean);

                if (productIds.length === 0) {
                    showEmptyProducts();
                    return;
                }

                const products = (await Promise.all(
                    productIds.map(async (pid) => {
                        const snap = await getDoc(doc(db, 'Product', pid));
                        return snap.exists() ? { id: snap.id, ...snap.data() } : null;
                    })
                )).filter(Boolean);

                if (products.length === 0) {
                    showEmptyProducts();
                } else {
                    renderProducts(products);
                }
            } catch (error) {
                console.error('Error fetching products:', error);
                modalBody.innerHTML = `
                    <div class="empty-products">
                        <div class="empty-products-icon">⚠️</div>
                        <p>Failed to load products. Please try again.</p>
                    </div>
                `;
            }
        }

        function renderProducts(products) {
            const grid = document.createElement('div');
            grid.className = 'products-grid';

            products.forEach(product => {
                const card = createProductCard(product);
                grid.appendChild(card);
            });

            modalBody.innerHTML = '';
            modalBody.appendChild(grid);
        }

        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';

            const imageWrapper = document.createElement('div');
            imageWrapper.className = 'product-image-wrapper';

            const img = document.createElement('img');
            img.className = 'product-image';
            img.src = product['Image Link'] || product.imageLink || 'https://via.placeholder.com/300x300?text=Product';
            img.alt = product['Alt Image'] || product.altImage || product['Product Name'] || product.productName || 'Product';
            img.loading = 'lazy';

            imageWrapper.appendChild(img);

            const info = document.createElement('div');
            info.className = 'product-info';

            const name = document.createElement('h3');
            name.className = 'product-name';
            name.textContent = product['Product Name'] || product.productName || 'Unnamed Product';

            const btn = document.createElement('a');
            btn.className = 'product-btn';
            btn.href = product['Affiliate Link'] || product.affiliateLink || '#';
            btn.target = '_blank';
            btn.rel = 'noopener noreferrer';
            btn.textContent = 'Buy Now';

            info.appendChild(name);
            info.appendChild(btn);

            card.appendChild(imageWrapper);
            card.appendChild(info);

            return card;
        }

        function showEmptyProducts() {
            modalBody.innerHTML = `
                <div class="empty-products">
                    <div class="empty-products-icon">🎀</div>
                    <p>No products linked to this post yet.</p>
                </div>
            `;
        }

        function closeModal() {
            modalOverlay.classList.add('closing');
            setTimeout(() => {
                modalOverlay.classList.remove('active', 'closing');
                document.body.style.overflow = '';
            }, 300);
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
        });
        modal.addEventListener('click', (e) => e.stopPropagation());

        /* ── Empty / error states ── */
        function showEmptyState() {
            postsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📸</div>
                    <h2>No Instagram posts available.</h2>
                    <p>Check back soon for inspiring content!</p>
                </div>
            `;
        }

        function showErrorState() {
            postsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <h2>Failed to load.</h2>
                    <p>Check your connection and try again.</p>
                </div>
            `;
        }

        /* ── Sparkles (still used in modal maybe but not on double‑tap, kept for UI) ── */
        function createSparkles(x, y) {
            const sparkleCount = 8;
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const angle = (Math.PI * 2 * i) / sparkleCount;
                const distance = Math.random() * 60 + 40;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                sparkle.style.setProperty('--x', tx + 'px');
                sparkle.style.setProperty('--y', ty + 'px');
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1200);
            }
        }

        function createParticles() {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
                const xDistance = (Math.random() - 0.5) * 200;
                particle.style.setProperty('--x-distance', xDistance + 'px');
                const colors = ['#5b7a8c', '#f09433', '#dc2743', '#bc1888'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(particle);
            }
        }

        /* ── Toggle event ── */
        orderToggleBtn.addEventListener('click', () => {
            randomOrder = !randomOrder;
            orderToggleBtn.textContent = randomOrder ? '🔀 Random' : '📋 Ordered';
            applySortAndRender();
        });

        /* ── Boot ── */
        createParticles();
        fetchData();
    </script>
</body>
</html>
