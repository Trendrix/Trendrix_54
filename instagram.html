
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Shop - Trendrix | Your Personal Digital Closet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/shared.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --main-color: #5b7a8c;
            --bg-color: #f7f4f0;
            --card-bg: #ffffff;
            --text-color: #2e2e2e;
            --muted-color: #5a5a5a;
            --radius: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);
            --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(240, 148, 51, 0.03), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(188, 24, 136, 0.03), transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(220, 39, 67, 0.02), transparent 50%);
            animation: gradientMove 15s ease infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientMove {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 50px) scale(0.9);
            }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--main-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: particleFloat 8s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            50% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--x-distance)) scale(1);
                opacity: 0;
            }
        }

        /* Sparkle animation */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 20px;
            height: 20px;
            animation: sparkleAnim 1.2s ease-out forwards;
        }

        .sparkle::before,
        .sparkle::after {
            content: '';
            position: absolute;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            border-radius: 50%;
        }

        .sparkle::before {
            width: 4px;
            height: 4px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .sparkle::after {
            width: 8px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        @keyframes sparkleAnim {
            0% {
                transform: translate(var(--x), var(--y)) scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1.5) rotate(180deg);
                opacity: 0;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        /* Shared nav is injected by assets/shared-nav.js */

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 2rem 3rem;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeInDown 0.8s ease;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            animation: gradientShift 3s ease infinite, titleFloat 4s ease-in-out infinite;
            background-size: 200% 200%;
            position: relative;
        }

        .hero h1::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(240, 148, 51, 0.1), transparent 70%);
            animation: pulse 3s ease-in-out infinite;
            z-index: -1;
            border-radius: 50%;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes titleFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--muted-color);
            font-weight: 400;
            animation: fadeInUp 1s ease 0.3s backwards;
        }

        .insta-icon {
            display: inline-block;
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            position: relative;
            animation: iconPulse 2s ease-in-out infinite;
        }

        .insta-icon::before,
        .insta-icon::after {
            content: '';
            position: absolute;
            border-radius: 12px;
        }

        .insta-icon::before {
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            background: var(--insta-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: iconRotate 8s linear infinite;
        }

        .insta-icon::after {
            width: 20px;
            height: 20px;
            background: var(--insta-gradient);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes iconRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 1.5rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(91, 122, 140, 0.1);
            border-top-color: #f09433;
            border-right-color: #dc2743;
            border-bottom-color: #bc1888;
            border-left-color: #e6683c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite, colorShift 3s ease infinite;
        }

        @keyframes colorShift {
            0%, 100% {
                filter: hue-rotate(0deg);
            }
            50% {
                filter: hue-rotate(45deg);
            }
        }

        .loading-text {
            font-size: 1.1rem;
            color: var(--muted-color);
            font-weight: 500;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted-color);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Instagram Posts Grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
            position: relative;
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
            z-index: 1;
            pointer-events: none;
        }

        .post-card:hover::before {
            left: 100%;
        }

        .post-card:nth-child(1) { animation-delay: 0.1s; }
        .post-card:nth-child(2) { animation-delay: 0.2s; }
        .post-card:nth-child(3) { animation-delay: 0.3s; }
        .post-card:nth-child(4) { animation-delay: 0.4s; }
        .post-card:nth-child(5) { animation-delay: 0.5s; }
        .post-card:nth-child(6) { animation-delay: 0.6s; }
        .post-card:nth-child(n+7) { animation-delay: 0.7s; }

        .post-card:hover {
            transform: translateY(-12px) rotateZ(0.5deg);
            box-shadow: 0 20px 40px rgba(91, 122, 140, 0.25);
        }

        .post-thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 aspect ratio */
            overflow: hidden;
            background: linear-gradient(135deg, #f7f4f0 0%, #e8e4df 100%);
        }

        .post-thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .post-card:hover .post-thumbnail {
            transform: scale(1.08);
        }

        .post-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        .post-badge.reel {
            background: var(--insta-gradient);
            animation: badgePulse 2s ease-in-out infinite, shimmer 3s linear infinite;
        }

        @keyframes badgePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        /* Like button animation */
        .like-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            color: #ff1744;
            text-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
        }

        .like-overlay.active {
            animation: likeHeart 0.8s ease-out;
        }

        @keyframes likeHeart {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        .post-actions {
            padding: 1.5rem;
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--main-color);
            color: var(--main-color);
        }

        .btn-outline:hover {
            background: var(--main-color);
            color: white;
            transform: scale(0.98);
            animation: wiggle 0.5s ease;
        }

        .btn-filled {
            background: var(--text-color);
            color: white;
            border: 2px solid var(--text-color);
            position: relative;
            overflow: hidden;
        }

        .btn-filled::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-filled:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-filled:hover {
            background: var(--main-color);
            border-color: var(--main-color);
            transform: scale(0.98);
            animation: wiggle 0.5s ease;
        }

        @keyframes wiggle {
            0%, 100% { transform: scale(0.98) rotate(0deg); }
            25% { transform: scale(0.98) rotate(-2deg); }
            75% { transform: scale(0.98) rotate(2deg); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        .modal-overlay.closing {
            animation: fadeOut 0.3s ease forwards;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: scale(0.9);
            opacity: 0;
            animation: modalEnter 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .modal-overlay.closing .modal {
            animation: modalExit 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid rgba(91, 122, 140, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 1.75rem;
            color: var(--main-color);
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--muted-color);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 0, 0, 0.1);
            color: #ff0000;
            transform: rotate(90deg) scale(1.1);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(90deg) scale(1.1) translateX(0); }
            25% { transform: rotate(90deg) scale(1.1) translateX(-3px); }
            75% { transform: rotate(90deg) scale(1.1) translateX(3px); }
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem;
            gap: 1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--bg-color);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px) rotate(-1deg);
            border-color: var(--main-color);
            box-shadow: var(--shadow-md);
            animation: wiggleCard 0.5s ease;
        }

        @keyframes wiggleCard {
            0%, 100% { transform: translateY(-4px) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-1deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
            75% { transform: translateY(-4px) rotate(-1deg); }
        }

        .product-image-wrapper {
            width: 100%;
            padding-top: 100%;
            position: relative;
            overflow: hidden;
            background: white;
        }

        .product-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1rem;
            text-align: center;
        }

        .product-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
            margin-bottom: 0.75rem;
            line-height: 1.4;
            min-height: 2.8em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-btn {
            width: 100%;
            padding: 0.65rem 1.25rem;
            background: var(--main-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .product-btn:hover {
            background: var(--text-color);
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(91, 122, 140, 0.3);
        }

        .product-btn:active {
            animation: bounce 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(0.97); }
            50% { transform: scale(0.92); }
        }

        /* Heart reaction counter */
        .heart-counter {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .heart-counter:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 1);
        }

        .heart-counter.liked {
            animation: heartBeat 0.5s ease;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(0.95); }
            75% { transform: scale(1.1); }
        }

        .heart-icon {
            color: #ff1744;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .heart-counter:not(.liked) .heart-icon {
            color: #ccc;
        }

        .empty-products {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--muted-color);
        }

        .empty-products-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            background: var(--card-bg);
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(91, 122, 140, 0.1);
            margin-top: 4rem;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-tagline {
            color: var(--main-color);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .footer-copyright {
            color: var(--muted-color);
            font-size: 0.95rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes modalExit {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 1rem;
            }

            .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .brand {
                font-size: 1.25rem;
            }

            .hero {
                padding: 3rem 1.5rem 2rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .posts-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.5rem;
            }

            .post-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .modal {
                width: 98%;
                max-height: 95vh;
            }

            .modal-header {
                padding: 1.5rem;
            }

            .modal-header h2 {
                font-size: 1.4rem;
            }

            .modal-body {
                padding: 1.5rem;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 0.75rem;
                font-size: 0.85rem;
            }

            .hero h1 {
                font-size: 1.75rem;
            }

            .posts-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--main-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-color);
        }
    </style>
</head>
<body>
    <!-- Shared Navigation -->
    <div id="txNavHost"></div>

    <!-- Hero Section -->
    <div class="hero tx-page-pad">
        <div class="insta-icon"></div>
        <h1>Instagram Shop</h1>
        <p>Watch reels, shop the look</p>
    </div>

    <!-- Main Content -->
    <div class="container tx-first-content">
        <div id="postsContainer">
            <!-- Loading state -->
            <div class="loading-container">
                <div class="spinner"></div>
                <p class="loading-text">Loading inspiring posts...</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2>Shop this look</h2>
                <button class="close-btn" id="closeModal" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading products...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="txFooterHost"></div>

    <!-- Firebase SDK -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
        }
    }
    </script>

    <script type="module">
        import { collection, getDocs, query, where, doc, getDoc } from 'firebase/firestore';
        import { db } from './firebase-config.js';

        // State
        let instagramPosts = [];

        // DOM Elements
        const postsContainer = document.getElementById('postsContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModal');
        import { mountSharedNav } from './assets/shared-nav.js';
        mountSharedNav({ active: 'instagram.html' });

        // Fetch Instagram (Collection: Instagram)
        async function fetchInstagramPosts() {
            try {
                const postsCollection = collection(db, 'Instagram');
                const snapshot = await getDocs(postsCollection);
                
                instagramPosts = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // Stable sort by document id if it follows IA00001 pattern
                instagramPosts.sort((a, b) => String(a.id).localeCompare(String(b.id)));

                if (instagramPosts.length === 0) {
                    showEmptyState();
                } else {
                    renderPosts();
                }
            } catch (error) {
                console.error('Error fetching posts:', error);
                showErrorState();
            }
        }

        // Render Posts
        function renderPosts() {
            const grid = document.createElement('div');
            grid.className = 'posts-grid';

            instagramPosts.forEach((post, index) => {
                const card = createPostCard(post, index);
                grid.appendChild(card);
            });

            postsContainer.innerHTML = '';
            postsContainer.appendChild(grid);
        }

        // Create Post Card
        function createPostCard(post, index) {
            const card = document.createElement('div');
            card.className = 'post-card';

            const thumbnailWrapper = document.createElement('div');
            thumbnailWrapper.className = 'post-thumbnail-wrapper';

            const img = document.createElement('img');
            img.className = 'post-thumbnail';
            img.src = post['Thumbnail'] || post.thumbnail || 'https://via.placeholder.com/400x400?text=Instagram+Post';
            img.alt = post['Alt Image'] || post.altImage || 'Instagram post';
            img.loading = 'lazy';

            const badge = document.createElement('div');
            badge.className = `post-badge ${post.type === 'Reel' ? 'reel' : ''}`;
            const type = post['Type'] || post.type || 'Post';
            badge.className = `post-badge ${String(type).toLowerCase() === 'reel' ? 'reel' : ''}`;
            badge.textContent = String(type).toLowerCase() === 'reel' ? 'REEL' : 'POST';

            // Like overlay for double-tap effect
            const likeOverlay = document.createElement('div');
            likeOverlay.className = 'like-overlay';
            likeOverlay.textContent = '❤️';

            // Heart counter
            const heartCounter = document.createElement('div');
            heartCounter.className = 'heart-counter';
            const randomLikes = Math.floor(Math.random() * 500) + 50;
            heartCounter.innerHTML = `<span class="heart-icon">❤</span><span>${randomLikes}</span>`;
            
            let isLiked = false;
            let likeCount = randomLikes;

            // Double-tap to like
            let lastTap = 0;
            thumbnailWrapper.addEventListener('click', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                
                if (tapLength < 300 && tapLength > 0) {
                    // Double tap detected
                    likeOverlay.classList.add('active');
                    setTimeout(() => likeOverlay.classList.remove('active'), 800);
                    
                    if (!isLiked) {
                        isLiked = true;
                        likeCount++;
                        heartCounter.classList.add('liked');
                        heartCounter.innerHTML = `<span class="heart-icon">❤</span><span>${likeCount}</span>`;
                    }
                    
                    createSparkles(e.clientX, e.clientY);
                }
                lastTap = currentTime;
            });

            // Single tap on heart counter
            heartCounter.addEventListener('click', (e) => {
                e.stopPropagation();
                isLiked = !isLiked;
                
                if (isLiked) {
                    likeCount++;
                    heartCounter.classList.add('liked');
                } else {
                    likeCount--;
                    heartCounter.classList.remove('liked');
                }
                
                heartCounter.innerHTML = `<span class="heart-icon">❤</span><span>${likeCount}</span>`;
                createSparkles(e.clientX, e.clientY);
            });

            thumbnailWrapper.appendChild(img);
            thumbnailWrapper.appendChild(badge);
            thumbnailWrapper.appendChild(likeOverlay);
            thumbnailWrapper.appendChild(heartCounter);

            const actions = document.createElement('div');
            actions.className = 'post-actions';

            const watchBtn = document.createElement('a');
            watchBtn.className = 'btn btn-outline';
            watchBtn.href = post['Link'] || post.link || '#';
            watchBtn.target = '_blank';
            watchBtn.rel = 'noopener noreferrer';
            watchBtn.textContent = String(type).toLowerCase() === 'reel' ? '▶ Watch Reel' : '👀 View Post';

            const shopBtn = document.createElement('button');
            shopBtn.className = 'btn btn-filled';
            shopBtn.textContent = '🛍️ Buy Products';
            shopBtn.onclick = () => openProductModal(post.id);

            actions.appendChild(watchBtn);
            actions.appendChild(shopBtn);

            card.appendChild(thumbnailWrapper);
            card.appendChild(actions);

            return card;
        }

        // Open Product Modal
        async function openProductModal(instaId) {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Show loading state
            modalBody.innerHTML = `
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading products...</p>
                </div>
            `;
            
            // Add wave animation to modal header
            const modalHeader = document.querySelector('.modal-header');
            if (modalHeader && !modalHeader.querySelector('svg')) {
                const waves = createModalWaves();
                modalHeader.appendChild(waves.firstElementChild);
            }

            try {
                // Fetch product mappings
                const mappingQuery = query(
                    collection(db, 'INPR MAP'),
                    where('INSTA ID', '==', instaId)
                );
                const mappingSnapshot = await getDocs(mappingQuery);
                
                const productIds = mappingSnapshot.docs.map(doc => doc.data()['Product ID']).filter(Boolean);

                if (productIds.length === 0) {
                    showEmptyProducts();
                    return;
                }

                // Fetch each product (Collection: Product)
                const products = (await Promise.all(
                    productIds.map(async (pid) => {
                        const snap = await getDoc(doc(db, 'Product', pid));
                        return snap.exists() ? { id: snap.id, ...snap.data() } : null;
                    })
                )).filter(Boolean);

                if (products.length === 0) {
                    showEmptyProducts();
                } else {
                    renderProducts(products);
                }
            } catch (error) {
                console.error('Error fetching products:', error);
                modalBody.innerHTML = `
                    <div class="empty-products">
                        <div class="empty-products-icon">⚠️</div>
                        <p>Failed to load products. Please try again.</p>
                    </div>
                `;
            }
        }

        // Render Products in Modal
        function renderProducts(products) {
            const grid = document.createElement('div');
            grid.className = 'products-grid';

            products.forEach(product => {
                const card = createProductCard(product);
                grid.appendChild(card);
            });

            modalBody.innerHTML = '';
            modalBody.appendChild(grid);
        }

        // Create Product Card
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';

            const imageWrapper = document.createElement('div');
            imageWrapper.className = 'product-image-wrapper';

            const img = document.createElement('img');
            img.className = 'product-image';
            img.src = product['Image Link'] || product.imageLink || 'https://via.placeholder.com/300x300?text=Product';
            img.alt = product['Alt Image'] || product.altImage || product['Product Name'] || product.productName || 'Product';
            img.loading = 'lazy';

            imageWrapper.appendChild(img);

            const info = document.createElement('div');
            info.className = 'product-info';

            const name = document.createElement('h3');
            name.className = 'product-name';
            name.textContent = product['Product Name'] || product.productName || 'Unnamed Product';

            const btn = document.createElement('a');
            btn.className = 'product-btn';
            btn.href = product['Affiliate Link'] || product.affiliateLink || '#';
            btn.target = '_blank';
            btn.rel = 'noopener noreferrer';
            btn.textContent = 'Buy Now';

            info.appendChild(name);
            info.appendChild(btn);

            card.appendChild(imageWrapper);
            card.appendChild(info);

            return card;
        }

        // Show Empty Products State
        function showEmptyProducts() {
            modalBody.innerHTML = `
                <div class="empty-products">
                    <div class="empty-products-icon">🎀</div>
                    <p>No products linked to this post yet.</p>
                </div>
            `;
        }

        // Close Modal
        function closeModal() {
            modalOverlay.classList.add('closing');
            setTimeout(() => {
                modalOverlay.classList.remove('active', 'closing');
                document.body.style.overflow = '';
            }, 300);
        }

        closeModalBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // Prevent modal close when clicking inside modal
        modal.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Show Empty State
        function showEmptyState() {
            postsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📸</div>
                    <h2>No Instagram posts available.</h2>
                    <p>Check back soon for inspiring content!</p>
                </div>
            `;
        }

        // Show Error State
        function showErrorState() {
            postsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <h2>Failed to load.</h2>
                    <p>Check your connection and try again.</p>
                </div>
            `;
        }

        // Create sparkles effect
        function createSparkles(x, y) {
            const sparkleCount = 8;
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                const angle = (Math.PI * 2 * i) / sparkleCount;
                const distance = Math.random() * 60 + 40;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                sparkle.style.setProperty('--x', tx + 'px');
                sparkle.style.setProperty('--y', ty + 'px');
                
                document.body.appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 1200);
            }
        }

        // Create floating particles
        function createParticles() {
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
                
                const xDistance = (Math.random() - 0.5) * 200;
                particle.style.setProperty('--x-distance', xDistance + 'px');
                
                const colors = ['#5b7a8c', '#f09433', '#dc2743', '#bc1888'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(particle);
            }
        }

        // Add wave animation to modal
        function createModalWaves() {
            const waves = document.createElement('div');
            waves.innerHTML = `
                <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 120px; opacity: 0.1;" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M0,0 C300,80 600,80 900,0 C1050,40 1150,40 1200,0 L1200,120 L0,120 Z" fill="url(#waveGradient)">
                        <animate attributeName="d" 
                            dur="5s" 
                            repeatCount="indefinite"
                            values="M0,0 C300,80 600,80 900,0 C1050,40 1150,40 1200,0 L1200,120 L0,120 Z;
                                    M0,40 C300,0 600,0 900,40 C1050,80 1150,80 1200,40 L1200,120 L0,120 Z;
                                    M0,0 C300,80 600,80 900,0 C1050,40 1150,40 1200,0 L1200,120 L0,120 Z"/>
                    </path>
                    <defs>
                        <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#f09433;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#dc2743;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#bc1888;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            `;
            return waves;
        }

        // Initialize
        fetchInstagramPosts();
        createParticles();
    </script>
</body>
</html>
